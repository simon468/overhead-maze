<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mosslight Maze</title><style>
*{box-sizing:border-box}body{margin:0;background:#101d1b;color:#f4ecd4;font:16px system-ui,sans-serif}main{width:min(850px,94vw);margin:24px auto}header,footer,.stats{display:flex;align-items:center;justify-content:space-between;gap:16px}h1{font:normal clamp(30px,6vw,54px) Georgia,serif;letter-spacing:-.05em;margin:0}p{color:#c4d4c7;margin:6px 0 14px}.stats{font:14px monospace;color:#f8ce82;white-space:nowrap}#board{position:relative;height:min(64vh,650px);min-height:270px;background:#243733;border:1px solid #52665a;border-radius:18px;overflow:hidden}canvas{display:block;width:100%;height:100%}footer{margin-top:14px;flex-wrap:wrap}button{background:#253d35;color:#f4ecd4;border:1px solid #5c7464;border-radius:10px;padding:10px 15px;cursor:pointer;font:inherit;touch-action:manipulation}button:hover,button:focus-visible{background:#3b5748}#win{position:absolute;inset:0;background:#10221bdc;text-align:center;align-content:center}#win h2{font:38px Georgia;margin:0}#next{background:#e8bb75;color:#19251f}.pad{display:flex;gap:5px}.pad button{min-width:42px}small{color:#c4d4c7}@media(max-width:550px){header{align-items:flex-start;flex-direction:column;gap:5px}main{margin:16px auto}#board{height:min(100vw,55vh)}footer{gap:10px}}
</style></head><body><main><header><h1>Mosslight Maze</h1><div class="stats"><span id="level"></span><span id="moves"></span></div></header><p>Guide the amber lantern to the mint-green beacon.</p><div id="board"><canvas aria-label="Overhead maze with an amber lantern and a green exit"></canvas><div id="win" hidden><h2>Clearing reached</h2><p id="score"></p><button id="next">Next maze &rarr;</button></div></div><footer><small>Move with WASD or arrow keys</small><div class="pad" aria-label="Movement controls"><button data-dir="left" aria-label="Move left">←</button><button data-dir="up" aria-label="Move up">↑</button><button data-dir="down" aria-label="Move down">↓</button><button data-dir="right" aria-label="Move right">→</button></div><button id="restart">Restart maze</button></footer><p role="alert" id="error"></p></main><script src="vendor/three.min.js"></script><script src="game.js"></script></body></html>
